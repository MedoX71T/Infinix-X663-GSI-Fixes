<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSI-Ready X663 Banner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .banner {
            width: 1280px;
            height: 640px;
            background: linear-gradient(135deg, #F5E6D3 0%, #E5D5C0 50%, #D4C5B0 100%);
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        /* Decorative background elements */
        .bg-shapes {
            position: absolute;
            inset: 0;
            opacity: 0.08;
        }
        
        .shape {
            position: absolute;
            border-radius: 50%;
            background: #8B6F47;
        }
        
        .shape1 { width: 400px; height: 400px; top: -100px; right: -100px; }
        .shape2 { width: 300px; height: 300px; bottom: -80px; left: -80px; }
        .shape3 { width: 200px; height: 200px; top: 50%; left: 20%; transform: translateY(-50%); }
        
        /* Content container */
        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 80px;
        }
        
        /* Left side - Text */
        .text-content {
            flex: 1;
            max-width: 600px;
        }
        
        .logo-text {
            font-size: 72px;
            font-weight: 800;
            color: #5D4E37;
            line-height: 1;
            margin-bottom: 16px;
            letter-spacing: -2px;
        }
        
        .tagline {
            font-size: 28px;
            color: #8B6F47;
            font-weight: 500;
            margin-bottom: 32px;
            line-height: 1.3;
        }
        
        .badge-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .badge {
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .badge-primary {
            background: #D2691E;
            color: #F5E6D3;
        }
        
        .badge-success {
            background: rgba(107, 142, 35, 0.15);
            color: #6B8E23;
            border: 2px solid #6B8E23;
        }
        
        /* Right side - Phone visualization */
        .visual {
            flex: 0 0 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .phone-comparison {
            display: flex;
            gap: 40px;
            align-items: center;
        }
        
        .phone {
            width: 140px;
            height: 280px;
            background: linear-gradient(135deg, #5D4E37 0%, #3E2723 100%);
            border-radius: 24px;
            position: relative;
            box-shadow: 0 20px 40px rgba(61, 39, 35, 0.4);
            border: 3px solid #8B6F47;
        }
        
        .phone-screen {
            position: absolute;
            top: 20px;
            left: 10px;
            right: 10px;
            bottom: 40px;
            background: #1a1a1a;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .phone-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        
        .phone.before .phone-label {
            color: #CD5C5C;
        }
        
        .phone.after .phone-label {
            color: #6B8E23;
        }
        
        .status-icons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .status-icon {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        
        .icon-error {
            background: #CD5C5C;
            color: white;
        }
        
        .icon-success {
            background: #6B8E23;
            color: white;
        }
        
        .phone.before .status-icon {
            color: #CD5C5C;
        }
        
        .phone.after .status-icon {
            color: #6B8E23;
        }
        
        .arrow {
            font-size: 48px;
            color: #D2691E;
            font-weight: bold;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .home-button {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #8B6F47;
        }
        
        /* Device indicator */
        .device-label {
            position: absolute;
            bottom: 40px;
            left: 80px;
            font-size: 18px;
            color: #8B6F47;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="banner">
        <!-- Background decorative shapes -->
        <div class="bg-shapes">
            <div class="shape shape1"></div>
            <div class="shape shape2"></div>
            <div class="shape shape3"></div>
        </div>
        
        <!-- Main content -->
        <div class="content">
            <!-- Left: Text content -->
            <div class="text-content">
                <div class="logo-text">GSI-Ready<br>X663</div>
                <div class="tagline">Fix Network Issues on Custom Android</div>
                <div class="badge-group">
                    <div class="badge badge-primary">
                        <span>✓</span> WiFi & Data Fixed
                    </div>
                    <div class="badge badge-success">
                        <span>📱</span> Android 14-16
                    </div>
                </div>
            </div>
            
            <!-- Right: Phone visualization -->
            <div class="visual">
                <div class="phone-comparison">
                    <div class="phone before">
                        <div class="phone-screen">
                            <div class="phone-label">Before</div>
                            <div class="status-icons">
                                <div class="status-icon">
                                    <div class="icon icon-error">✗</div>
                                    WiFi
                                </div>
                                <div class="status-icon">
                                    <div class="icon icon-error">✗</div>
                                    Data
                                </div>
                            </div>
                        </div>
                        <div class="home-button"></div>
                    </div>
                    
                    <div class="arrow">→</div>
                    
                    <div class="phone after">
                        <div class="phone-screen">
                            <div class="phone-label">After</div>
                            <div class="status-icons">
                                <div class="status-icon">
                                    <div class="icon icon-success">✓</div>
                                    WiFi
                                </div>
                                <div class="status-icon">
                                    <div class="icon icon-success">✓</div>
                                    Data
                                </div>
                            </div>
                        </div>
                        <div class="home-button"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Device label -->
        <div class="device-label">Infinix Note 11 (X663)</div>
    </div>
</body>
</html>
