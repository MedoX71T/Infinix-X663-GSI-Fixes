<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSI-Ready X663 Logo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px;
        }
        
        .logo-container {
            width: 800px;
            height: 200px;
            background: linear-gradient(135deg, #F5E6D3 0%, #D4C5B0 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 60px;
            gap: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .icon-box {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #5D4E37 0%, #3E2723 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 8px 24px rgba(61, 39, 35, 0.3);
            flex-shrink: 0;
        }
        
        .phone-icon {
            width: 40px;
            height: 64px;
            background: #8B6F47;
            border-radius: 8px;
            position: relative;
            border: 2px solid #D4C5B0;
        }
        
        .phone-screen {
            position: absolute;
            top: 6px;
            left: 4px;
            right: 4px;
            bottom: 12px;
            background: #1a1a1a;
            border-radius: 4px;
        }
        
        .status-dot {
            position: absolute;
            top: 10px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: #6B8E23;
            border-radius: 50%;
            box-shadow: 0 0 8px #6B8E23;
        }
        
        .home-btn {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #D4C5B0;
            border-radius: 50%;
        }
        
        .text-content {
            flex: 1;
        }
        
        .logo-text {
            font-size: 56px;
            font-weight: 800;
            color: #5D4E37;
            line-height: 1;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }
        
        .tagline {
            font-size: 20px;
            color: #8B6F47;
            font-weight: 500;
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            background: #D2691E;
            color: #F5E6D3;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="icon-box">
            <div class="phone-icon">
                <div class="phone-screen"></div>
                <div class="status-dot"></div>
                <div class="home-btn"></div>
            </div>
        </div>
        
        <div class="text-content">
            <div class="logo-text">GSI-Ready X663</div>
            <div class="tagline">Custom Android for Infinix Note 11</div>
            <div class="badge">
                <span>✓</span> Network Fixed
            </div>
        </div>
    </div>
</body>
</html>
