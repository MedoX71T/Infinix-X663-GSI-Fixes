<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6D3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4C5B0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4C5B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6F47;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="#D2691E" opacity="0.15"/>
  <circle cx="1180" cy="540" r="80" fill="#8B6F47" opacity="0.1"/>
  <circle cx="950" cy="150" r="40" fill="#6B8E23" opacity="0.2"/>
  
  <!-- Phone illustration (left) -->
  <g transform="translate(150, 180)">
    <rect x="0" y="0" width="180" height="280" rx="20" fill="url(#phoneGrad2)" stroke="#5D4E37" stroke-width="4"/>
    <rect x="15" y="30" width="150" height="200" fill="#3E2723" opacity="0.4"/>
    <circle cx="90" cy="255" r="12" fill="#F5E6D3"/>
    
    <!-- Stock ROM indicator -->
    <text x="90" y="120" font-family="monospace" font-size="16" fill="#CD5C5C" text-anchor="middle" font-weight="bold">
      Stock ROM
    </text>
    <path d="M 70 130 L 110 130" stroke="#CD5C5C" stroke-width="2"/>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(420, 310)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#D2691E" stroke-width="6" stroke-linecap="round"/>
    <polygon points="120,0 100,-15 100,15" fill="#D2691E"/>
    <text x="60" y="-20" font-family="Arial, sans-serif" font-size="18" fill="#5D4E37" text-anchor="middle" font-weight="bold">
      PATCH
    </text>
  </g>
  
  <!-- Phone illustration (right - GSI) -->
  <g transform="translate(630, 180)">
    <rect x="0" y="0" width="180" height="280" rx="20" fill="url(#phoneGrad2)" stroke="#5D4E37" stroke-width="4"/>
    <rect x="15" y="30" width="150" height="200" fill="#3E2723" opacity="0.4"/>
    <circle cx="90" cy="255" r="12" fill="#F5E6D3"/>
    
    <!-- GSI indicator with wifi/data -->
    <text x="90" y="110" font-family="monospace" font-size="16" fill="#6B8E23" text-anchor="middle" font-weight="bold">
      Custom GSI
    </text>
    <text x="90" y="135" font-family="monospace" font-size="14" fill="#6B8E23" text-anchor="middle">
      ✓ WiFi ✓ Data
    </text>
    <circle cx="50" cy="160" r="8" fill="#6B8E23"/>
    <circle cx="90" cy="160" r="8" fill="#6B8E23"/>
    <circle cx="130" cy="160" r="8" fill="#6B8E23"/>
  </g>
  
  <!-- Title -->
  <text x="640" y="520" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#5D4E37" text-anchor="middle">
    GSI-Ready X663
  </text>
  
  <!-- Subtitle -->
  <text x="640" y="570" font-family="Arial, sans-serif" font-size="28" fill="#8B6F47" text-anchor="middle">
    Fix Network Issues on Custom Android ROMs (Infinix Note 11)
  </text>
  
  <!-- Features badges -->
  <g transform="translate(920, 200)">
    <rect x="0" y="0" width="300" height="220" rx="15" fill="#3E2723" opacity="0.8"/>
    
    <text x="150" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#F5E6D3" text-anchor="middle">
      What's Fixed
    </text>
    
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="18" fill="#6B8E23">
      ✓ WiFi Working
    </text>
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="18" fill="#6B8E23">
      ✓ Mobile Data
    </text>
    <text x="20" y="145" font-family="Arial, sans-serif" font-size="18" fill="#6B8E23">
      ✓ Hotspot Fixed
    </text>
    <text x="20" y="180" font-family="Arial, sans-serif" font-size="18" fill="#6B8E23">
      ✓ Boot Warnings
    </text>
    <text x="20" y="180" font-family="Arial, sans-serif" font-size="18" fill="#6B8E23">
      ✓ Boot Warnings
    </text>
    
    <text x="150" y="210" font-family="Arial, sans-serif" font-size="14" fill="#D4C5B0" text-anchor="middle">
      Android 14-16 Supported
    </text>
  </g>
</svg>